<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syracuse University</title>
</head>
<body>
  <div id="message" style="cursor: pointer; font-size: 2rem;" onclick="changeText()">Syracuse University</div>

  <script>
    function changeText() {
      var box = document.getElementById("message");
      box.innerHTML = "Orange Nation";
      box.style.color = "orange";
    }
  </script>
</body>
</html>
