<!DOCTYPE html>
<title>Header</title>
<html lang="en">
<head>

    <meta charset="UTF-8">
</head>
<body>
    <h1> Tables </h1>
    <table>
        <caption>Our First Table</caption>
        <tr>
            <th>Column One</th>
            <th>Column Two</th>
            <th>Column Three</th>
        </tr>
        <tr>
            <td>Freshmen</td>
            <td>Sophomore</td>
            <td>Junior</td>
        </tr>
</table>

    <h1>Forms</h1>
    <form action="https://httpbin.org/post" method="post">
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname"><br><br>
        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="message">Comments:</label><br>
        <textarea name="message" rows="4" cols="50" placeholder="Enter your message here..."></textarea> <br><br>

        <p>Please select your age:</p>
        <input type="radio" id="age1" name="age" value="under18">
        <label for="age1">0-30</label>
        <input type="radio" id="age2" name="age" value="18-24">
        <label for="age2">31-60</label>
        <input type="radio" id="age3" name="age" value="25-34">
        <label for="age3">60-100</label><br><br>


        <input type="checkbox" id="vehicle1" name="vehicle1" value="Bike">
        <label for="vehicle1"> I have a bike</label><br>
        <input type="checkbox" id="vehicle2" name="vehicle2" value="Car">
        <label for="vehicle2"> I have a car</label><br>
        <input type="checkbox" id="vehicle3" name="vehicle3" value="Boat">
        <label for="vehicle3"> I have a boat</label><br><br>
        

        <label for="cars">Choose a car:</label>
        <select name="cars" id="cars">  
            <option value="volvo">Volvo</option>
            <option value="saab">Saab</option>
            <option value="mercedes">Mercedes</option>
            <option value="audi">Audi</option>
        </select><br><br>
        <input type="submit" value="Submit">
        
    
    </form>
</body>
</html>
